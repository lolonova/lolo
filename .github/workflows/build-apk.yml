name: Build Mon Coach 90 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet
        run: |
          unzip -q MonCoach90_V5.zip -d source

      - name: Remplacer MainActivity
        run: |
          cp MainActivity.kt source/MonCoach90_V5/app/src/main/java/fr/moncoach90/app/MainActivity.kt
  
      - name: Construire l'application
        run: |
          cd source/MonCoach90_V5
          gradle assembleDebug

      - name: Recuperer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MonCoach90-V5
          path: source/MonCoach90_V5/app/build/outputs/apk/debug/app-debug.apk
