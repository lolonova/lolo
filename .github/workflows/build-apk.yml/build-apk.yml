name: Build Mon Coach 90 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet
        run: |
          unzip -q MonCoach90_V5.zip -d source

      - name: Construire l'application
        run: |
          cd source/MonCoach90_V5
          gradle assembleDebug

      - name: Recuperer l'APK
